<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xadrez</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: &quot;Courier New&quot;, Courier, monospace;
      font-weight: 600;
      background-color: #342005;
      gap: 12px;
      display: flex;
      flex-direction: column;
    "
  >
    <nav
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0px 32px;
        background-color: #1e1702;
        color: #e5e3e4;
      "
    >
      <h1 style="font-size: x-large">Xadrez</h1>
      <ul
        style="
          list-style-type: none;
          display: flex;
          justify-content: center;
          gap: 20px;
          width: fit-content;
          padding: 4px 18px;
        "
      >
        <li>
          <a href="index.html" style="text-decoration: none; color: #e5e3e4"
            >Início</a
          >
        </li>
        <li>
          <a href="jogar.html" style="text-decoration: none; color: #e5e3e4"
            >Jogar</a
          >
        </li>
        <li>
          <a href="sobre.html" style="text-decoration: none; color: #e5e3e4"
            >Sobre</a
          >
        </li>
      </ul>
    </nav>
    <section
      style="display: flex; align-items: center; justify-content: center"
    >
      <div
        id="tabuleiro"
        style="
          width: 576px;
          height: 576px;
          background-color: #e5e3e4;
          border: 8px solid #1e1702;
          display: grid;
          grid-template-columns: repeat(8, 1fr);
          grid-template-rows: repeat(8, 1fr);
        "
      ></div>
    </section>
    <script src="script.js"></script>
  </body>
</html>

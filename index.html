<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xadrez</title>
    <style>
      .casa-preta,
      .casa-branca {
        width: 72px;
        height: 72px;
        box-sizing: border-box;
        padding: 4px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        position: relative;
      }
      .casa-branca {
        background-color: #e6dabb;
        color: #1e1702;
      }
      .casa-preta {
        background-color: #8c886b;
        color: #e5e3e4;
      }
      .linha {
        grid-column: 1;
        grid-row: 1;
      }
      .coluna {
        grid-column: 3;
        grid-row: 3;
        display: flex;
        align-items: flex-end;
        justify-content: end;
      }
      .peca {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2.8rem;
        line-height: 1;
        z-index: 1;
        pointer-events: none;
      }
      #branca {
        color: #e5e3e4;
        text-shadow:
          -1px -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000,
          1px 1px 0 #000;
      }
      #preta {
        color: #1e1702;
        text-shadow:
          -1px -1px 0 #fff,
          1px -1px 0 #fff,
          -1px 1px 0 #fff,
          1px 1px 0 #fff;
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: &quot;Courier New&quot;, Courier, monospace;
      font-weight: 600;
      background-color: #342005;
      gap: 12px;
      display: flex;
      flex-direction: column;
    "
  >
    <nav
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0px 32px;
        background-color: #1e1702;
        color: #e5e3e4;
      "
    >
      <h1 style="font-size: x-large">Xadrez</h1>
      <ul
        style="
          list-style-type: none;
          display: flex;
          justify-content: center;
          gap: 20px;
          width: fit-content;
          padding: 4px 18px;
        "
      >
        <li>
          <a href="index.html" style="text-decoration: none; color: #e5e3e4"
            >Início</a
          >
        </li>
        <li>
          <a href="jogar.html" style="text-decoration: none; color: #e5e3e4"
            >Jogar</a
          >
        </li>
        <li>
          <a href="sobre.html" style="text-decoration: none; color: #e5e3e4"
            >Sobre</a
          >
        </li>
      </ul>
    </nav>
    <section
      style="display: flex; align-items: center; justify-content: center"
    >
      <div
        id="tabuleiro"
        style="
          width: 576px;
          height: 576px;
          background-color: #e5e3e4;
          border: 8px solid #1e1702;
          display: grid;
          grid-template-columns: repeat(8, 1fr);
          grid-template-rows: repeat(8, 1fr);
        "
      ></div>
    </section>
  </body>
  <script>
    const dicionarioColunas = {
      1: "A",
      2: "B",
      3: "C",
      4: "D",
      5: "E",
      6: "F",
      7: "G",
      8: "H",
    };
    const board = document.getElementById("tabuleiro");

    for (let linha = 8; linha >= 1; linha--) {
      for (let coluna = 1; coluna <= 8; coluna++) {
        let casa = document.createElement("div");
        casa.id = dicionarioColunas[coluna] + linha;

        let l = document.createElement("div");
        let c = document.createElement("div");

        if (linha == 1) {
          c.textContent = dicionarioColunas[coluna];
          c.classList.add("coluna");
          casa.appendChild(c);
        }
        if (coluna == 1) {
          l.textContent = linha;
          l.classList.add("linha");
          casa.appendChild(l);
        }
        if (
          (coluna % 2 != 0 && linha % 2 == 0) ||
          (coluna % 2 == 0 && linha % 2 != 0)
        ) {
          casa.classList.add("casa-branca");
        } else {
          casa.classList.add("casa-preta");
        }
        let peca = document.createElement("div");
        if (linha == 2) {
          peca.id = "branca";
          peca.textContent = "♙";
          peca.classList.add("peca");
          casa.appendChild(peca);
        }
        if (linha == 7) {
          peca.id = "preta";
          peca.textContent = "♟";
          peca.classList.add("peca");
          casa.appendChild(peca);
        }
        if (linha == 8) {
          peca.id = "preta";
          if (coluna == 1 || coluna == 8) {
            peca.textContent = "♜";
          }
          if (coluna == 2 || coluna == 7) {
            peca.textContent = "♞";
          }
          if (coluna == 3 || coluna == 6) {
            peca.textContent = "♝";
          }
          if (coluna == 4) {
            peca.textContent = "♛";
          }
          if (coluna == 5) {
            peca.textContent = "♚";
          }
          peca.classList.add("peca");
          casa.appendChild(peca);
        }
        if (linha == 1) {
          peca.id = "branca";
          if (coluna == 1 || coluna == 8) {
            peca.textContent = "♖";
          }
          if (coluna == 2 || coluna == 7) {
            peca.textContent = "♘";
          }
          if (coluna == 3 || coluna == 6) {
            peca.textContent = "♗";
          }
          if (coluna == 4) {
            peca.textContent = "♕";
          }
          if (coluna == 5) {
            peca.textContent = "♔";
          }
          peca.classList.add("peca");
          casa.appendChild(peca);
        }

        board.appendChild(casa);
      }
    }
  </script>
</html>
